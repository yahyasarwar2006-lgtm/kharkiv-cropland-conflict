[project]
name = "agridisrupt"
version = "0.1.0"
description = "Climate-aware NDVI anomaly detection in conflict-affected cropland (Kharkiv oblast)"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
